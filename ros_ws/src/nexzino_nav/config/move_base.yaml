shutdown_costmaps: false
controller_frequency: 10.0
planner_frequency: 2.0
planner_patience: 5.0
controller_patience: 15.0
conservative_reset_dist: 2.0
# Final low-speed alignment can legitimately spend several seconds without
# translating 0.2 m. Disable the translation-based oscillation timeout so it
# cannot mistake normal goal alignment for a stuck robot.
oscillation_timeout: 0.0
oscillation_distance: 0.2
# This controls move_base's automatic rotate recovery, not DWA's normal turns
# or final yaw alignment. Avoid an unexpected recovery spin near the goal.
clearing_rotation_allowed: false
