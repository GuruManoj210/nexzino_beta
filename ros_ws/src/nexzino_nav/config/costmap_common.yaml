obstacle_range: 2.0
raytrace_range: 2.5

# Use the measured square chassis envelope rather than a circumscribed circle.
# The circle made the robot look ~9 cm larger in the forward/side directions,
# which was enough for the local costmap to reject otherwise-legal turns.
footprint: [[0.22, 0.22], [-0.22, 0.22], [-0.22, -0.22], [0.22, -0.22]]
inflation_radius: 0.10
cost_scaling_factor: 6.0

transform_tolerance: 0.3
map_type: costmap
observation_sources: pointcloud

pointcloud:
  data_type: PointCloud2
  topic: /camera/depth/color/points
  marking: true
  clearing: true
  # This front depth camera is the only obstacle source. Keep the reactive
  # window local so sporadic far/noisy depth returns do not poison DWA.
  obstacle_range: 2.0
  raytrace_range: 2.5
  expected_update_rate: 0.3
  observation_persistence: 0.0
  # Ignore points too close to floor level; this stack has already shown
  # occasional camera/USB instability, and shallow floor speckle near the base
  # is enough to make rotate recovery report Cost:-1.
  min_obstacle_height: 0.08
  max_obstacle_height: 1.50
