frame_id: base_footprint
odom_frame_id: odom
subscribe_depth: true
subscribe_scan: false
approx_sync: true
sync_queue_size: 20
wait_for_transform_duration: 0.2

use_action_for_goal: true
Reg/Force3DoF: "true"
RGBD/OptimizeFromGraphEnd: "false"
RGBD/ProximityBySpace: "true"
RGBD/AngularUpdate: "0.05"
RGBD/LinearUpdate: "0.05"
Grid/Sensor: "1"
Grid/3D: "false"
Grid/RangeMax: "4.0"
Grid/MinClusterSize: "20"
Kp/DetectorStrategy: "8"
Kp/MaxDepth: "4.0"
Vis/MinInliers: "15"
Vis/InlierDistance: "0.1"
# Confirmed via rtabmap-databaseViewer on a real rejected loop closure: the
# matched keypoints were almost all on the floor's speckle texture (visible
# as a near-uniform horizontal "shear" of match lines - the signature of
# aliased speckle-to-speckle matches, not real correspondences), not on the
# actual distinct objects also visible in frame (a light-colored round
# object, a door/cabinet edge). The floor's fine texture generates far more
# candidate keypoints than those real landmarks do, drowning them out.
# Ignore the bottom 30% of the image, where the camera sees mostly repetitive
# floor texture. Apply the same ROI to both place recognition (Kp) and visual
# transform estimation (Vis); otherwise RTAB-Map can propose a floor-based
# candidate and then fail its geometric verification with 0 inliers.
Kp/RoiRatios: "0.0 0.0 0.0 0.30"
Kp/SSC: "true"
Kp/NndrRatio: "0.7"
Vis/FeatureType: "8"
Vis/RoiRatios: "0.0 0.0 0.0 0.30"
Vis/SSC: "true"
Vis/MaxDepth: "4.0"
Vis/CorNNDR: "0.7"
