frame_id: base_footprint
odom_frame_id: odom
subscribe_depth: true
subscribe_scan: false
approx_sync: true
sync_queue_size: 20
wait_for_transform_duration: 0.2

use_action_for_goal: true
Reg/Force3DoF: "true"
RGBD/OptimizeFromGraphEnd: "false"
RGBD/ProximityBySpace: "true"
RGBD/AngularUpdate: "0.05"
RGBD/LinearUpdate: "0.05"
Grid/Sensor: "1"
Grid/3D: "false"
Grid/RangeMax: "4.0"
Grid/MinClusterSize: "20"
Kp/MaxDepth: "4.0"
Vis/MinInliers: "15"
Vis/InlierDistance: "0.1"
# Confirmed via rtabmap-databaseViewer on a real rejected loop closure: the
# matched keypoints were almost all on the floor's speckle texture (visible
# as a near-uniform horizontal "shear" of match lines - the signature of
# aliased speckle-to-speckle matches, not real correspondences), not on the
# actual distinct objects also visible in frame (a light-colored round
# object, a door/cabinet edge). The floor's fine texture generates far more
# candidate keypoints than those real landmarks do, drowning them out.
# Kp/SSC spreads keypoints evenly across the image instead of letting them
# cluster wherever there's the most local texture, giving sparser real
# landmarks a fairer share of the keypoint budget. Kp/NndrRatio tightened
# from the 0.8 default (lower = stricter nearest-neighbor ratio test -
# rejects the kind of ambiguous "this speckle sort of looks like a few
# other speckles" matches a repetitive texture produces). Needs a fresh map
# to take full effect - existing .db files have keypoints already stored
# under the old (unfiltered) settings.
Kp/SSC: "true"
Kp/NndrRatio: "0.7"
