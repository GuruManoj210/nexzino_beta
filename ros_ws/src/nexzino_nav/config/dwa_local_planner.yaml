DWAPlannerROS:
  # Capped for the real hardware: wheel_radius=0.104246 and max_rpm=50 (see
  # diff_drive.yaml) give a straight-line ceiling of ~0.55 m/s per wheel,
  # but DWA can command linear+angular simultaneously, and each wheel's
  # speed is linear +/- angular*wheel_separation/2. At the old 0.45/1.20
  # limits, combined motion could ask for ~0.65 m/s per wheel - over the
  # real ceiling, so diff_drive_controller.py's clamp_rpm() would silently
  # cut it, meaning DWA's trajectory scoring was working off velocities the
  # robot could never actually deliver. These limits keep worst-case
  # combined per-wheel speed (0.20 + 0.5*0.33956/2 ~= 0.285 m/s, ~26 RPM)
  # comfortably under the real 50 RPM ceiling.
  # Forward-only: the robot has no rear obstacle coverage. This is also
  # enforced in diff_drive_controller.py as a final safety boundary.
  max_vel_x: 0.20
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.20
  # Keep the final approach slow, but not so slow that the motor driver's
  # integer-RPM command quantization turns it into a much smaller or zero
  # wheel command than DWA actually scored.
  min_vel_trans: 0.03
  max_vel_theta: 0.5
  # The previous 0.05 rad/s "creep" command is below this base's effective
  # integer-RPM resolution: with wheel_radius=0.104246 and
  # wheel_separation=0.33956 it works out to only ~0.78 wheel RPM, which the
  # driver rounded/truncated away. That leaves DWA thinking it is making a
  # tiny heading correction while the robot physically barely moves, then the
  # next cycle chooses the opposite sign and the base twitches left/right in
  # place. ~0.13 rad/s corresponds to ~2 RPM per wheel in-place, which is
  # still gentle but actually executable.
  min_vel_theta: 0.13

  # The motor controller ramps over 500 ms. Model that gentler acceleration
  # and braking instead of asking DWA to score unrealistically abrupt stops.
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.8

  # Include the real motor stopping distance and residual localization lag.
  # Latching at 15 cm makes the robot stop translating before it crosses the
  # target; yaw is then corrected in place.
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.25
  # Once inside the position tolerance, keep it satisfied while aligning
  # yaw. Otherwise small pose/noise changes can make DWA cross the goal and
  # attempt a positional correction in the opposite direction.
  latch_xy_goal_tolerance: true

  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.03

  # Balance between over-committing to long arcs and becoming too myopic near
  # clutter. 2.0 was smoother in open space, but when depth data got noisy it
  # let DWA project wide trajectories that collided early and wiped out nearly
  # every sample. 1.0 keeps the controller responsive without the earlier
  # twitchiness of an excessively short horizon.
  sim_time: 1.0
  vx_samples: 20
  vy_samples: 0
  vth_samples: 40
  controller_frequency: 10.0

  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  # A long forward scoring point encourages a wide arc to align the nose.
  # Keep it close to the base so final orientation is handled in place.
  forward_point_distance: 0.10
  stop_time_buffer: 0.2
  scaling_speed: 0.15
  max_scaling_factor: 0.2

  # Was 0.05m - move_base's OWN oscillation check (move_base.yaml's
  # oscillation_distance) uses 0.2m as its threshold for "has the robot
  # actually made progress". Having DWA's own reset distance 4x tighter than
  # that meant DWA could flag a trajectory as oscillating well before
  # move_base would agree it was actually stuck, escalating recovery
  # behaviors too eagerly during normal careful maneuvering. Matching them
  # removes that mismatch.
  oscillation_reset_dist: 0.2
  publish_traj_pc: true
  publish_cost_grid_pc: true
