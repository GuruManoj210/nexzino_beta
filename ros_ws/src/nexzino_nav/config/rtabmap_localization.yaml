frame_id: base_footprint
odom_frame_id: odom
subscribe_depth: true
subscribe_scan: false
approx_sync: true
sync_queue_size: 20
wait_for_transform_duration: 0.2

use_action_for_goal: true
Reg/Force3DoF: "true"
Mem/IncrementalMemory: "false"
Mem/InitWMWithAllNodes: "true"
# Default (>0) makes rtabmap withhold a computed localization correction
# until a SECOND confirming match arrives before publishing/applying it -
# confirmed directly in the logs: "Localization was good, but waiting for
# another one to be more accurate (RGBD/MaxOdomCacheSize>0)" fired for both
# the initial DB-loaded pose and an explicit /initialpose click, and neither
# ever visibly updated the robot's position. Given how hard it already is to
# get even one solid match on this floor, waiting for a second one could
# mean the correction never gets published at all. 0 = trust and publish
# the first good match immediately.
RGBD/MaxOdomCacheSize: "0"
RGBD/AngularUpdate: "0.05"
RGBD/LinearUpdate: "0.05"
Grid/Sensor: "1"
Grid/3D: "false"
Grid/RangeMax: "4.0"
Kp/MaxDepth: "4.0"
# See rtabmap_mapping.yaml for the reasoning (confirmed via
# rtabmap-databaseViewer: rejected matches were on the floor's speckle
# texture, not real landmarks). Matching here too so localization-time
# feature detection is consistent with how a freshly-built map's keypoints
# were selected.
Kp/SSC: "true"
Kp/NndrRatio: "0.7"
