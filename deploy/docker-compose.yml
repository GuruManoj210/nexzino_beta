services:
  nexzino:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nexzino-deploy:latest
    container_name: nexzino-deploy
    # host networking - servo_tester (5000) and web_teleop (8000) are reachable
    # at the host's IP directly, no "ports:" mapping needed or used here.
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      ROS_MASTER_URI: http://localhost:11311
      ROS_HOSTNAME: localhost
      # Pin exact serial device paths when multiple USB-serial adapters are
      # connected, so auto-detection can't grab the wrong one. Leave blank
      # to keep the existing behavior (yaml default / profile / auto-detect).
      # Set these in deploy/.env (copy deploy/.env.example) - see README.md
      # "Pinning serial ports" for how to find the stable /dev/serial/by-id
      # path for each adapter.
      WHEEL_CONTROLLER_PORT: "${WHEEL_CONTROLLER_PORT:-}"
      SERVO_CONTROLLER_PORT: "${SERVO_CONTROLLER_PORT:-}"
      # Lets rviz/rqt pop up on a monitor plugged into the robot itself,
      # e.g. `roslaunch nexzino_nav mapping.launch ... open_rviz:=true` run
      # by hand inside the container (nav_console's Start Mapping always
      # passes open_rviz:=false - see README "Debugging with RViz on the
      # robot"). Empty/unset DISPLAY (the normal headless case) makes this a
      # no-op - nothing tries to use it unless you explicitly launch a GUI
      # app inside the container.
      # Falls back to :0 (the near-universal default for a single directly-
      # attached monitor) if the shell running `docker compose up` didn't
      # have DISPLAY exported - see README "Debugging with RViz on the
      # robot" for why that's the actual failure mode if this still doesn't
      # work (an empty DISPLAY connects to nothing; xhost is a separate,
      # later step that only matters once a connection succeeds at all).
      DISPLAY: "${DISPLAY:-:0}"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - servo-data:/opt/nexzino/servo_tester/data
      # RTAB-Map's map database (~/.ros/nexzino_rtabmap.db, i.e. /root/.ros/...
      # since this image runs as root) lives here by default - without this
      # volume it's lost whenever the container is removed and recreated,
      # not just rebuilt. See deploy/README.md "Mapping and navigation".
      - ros-home:/root/.ros
      # nav_console's saved maps: maps.json registry + one RTAB-Map .db per
      # saved map (data/), and the .pgm/.yaml/.png thumbnails the web UI
      # displays (static/maps/). Without these, saved maps vanish on
      # container recreation the same way servo_tester's data would.
      - nav-console-data:/opt/nexzino/nav_console/data
      - nav-console-maps:/opt/nexzino/nav_console/static/maps

volumes:
  servo-data:
  ros-home:
  nav-console-data:
  nav-console-maps:
